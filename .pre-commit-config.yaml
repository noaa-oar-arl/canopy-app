repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v4.4.0"
    hooks:
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md,markdown']
      - id: end-of-file-fixer
      - id: check-yaml

  # Fortran formatting disabled due to findent compatibility issues
  # Alternative approaches for Fortran formatting:
  # 1. Manual formatting: findent -i4 <file>
  # 2. Use fprettify (more reliable): pip install fprettify
  # 3. Uncomment the fprettify section below (recommended)
  # - repo: https://github.com/zmoon/findent-pre-commit
  #   rev: "v4.2.5"
  #   hooks:
  #     - id: findent
  #       args: ['-i4', '--input-format=free']
  #       files: \.(f90|F90|f95|F95|f03|F03|f08|F08)$

  # Recommended: fprettify for Fortran formatting (uncomment to enable)
  # - repo: https://github.com/pseewald/fprettify
  #   rev: "v0.3.7"
  #   hooks:
  #     - id: fprettify
  #       args: ['--indent=4', '--line-length=120']
  #       files: \.(f90|F90|f95|F95|f03|F03|f08|F08)$

  - repo: https://github.com/asottile/pyupgrade
    rev: "v3.3.1"
    hooks:
      - id: pyupgrade
        args: [--py37-plus]

  - repo: https://github.com/PyCQA/isort
    rev: "5.12.0"
    hooks:
      - id: isort
        args: [--line-length=90, --profile=black]

  - repo: https://github.com/psf/black
    rev: "23.3.0"
    hooks:
      - id: black-jupyter
        args: [--line-length=90]

  - repo: https://github.com/PyCQA/flake8
    rev: "6.0.0"
    hooks:
      - id: flake8
        args: [--max-line-length=90, "--ignore=E203,E402,E501,W503,E226"]

  - repo: https://github.com/kynan/nbstripout
    rev: "0.6.1"
    hooks:
      - id: nbstripout
